<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Cache-Control" content="no-cache">
<title>Farber Fleet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="style.css?v=202611041346">
<script>try { var t = localStorage.getItem('ff-theme'); if (t && t !== 'auto') document.documentElement.classList.add('themed', 't-' + t); } catch (e) {}</script>
</head>
<body>
<div class="wrap">
  <header class="top">
    <button type="button" class="icon-btn" id="menu-btn" aria-expanded="false" aria-controls="menu" aria-label="Menu" hidden><svg width="26" height="26" viewBox="0 0 20 20" aria-hidden="true" focusable="false"><path d="M3 5h14M3 10h14M3 15h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
    <nav class="menu" id="menu" hidden aria-label="Farber Fleet pages">
      <p class="menu-group staff-only">Fleet</p>
      <a href="#trucks" data-page="trucks" class="staff-only">All trucks</a>
      <a href="#offline" data-page="offline" class="staff-only not-sales">Trucks offline</a>
      <a href="#shocks" data-page="shocks" class="staff-only not-sales">Shocks this week</a>
      <a href="#warnings" data-page="warnings" class="staff-only not-sales">Trucks with warnings</a>
      <a href="#mytrucks" data-page="mytrucks" class="customer-only" hidden>My trucks</a>
      <p class="menu-group service-only" hidden>Service</p>
      <a href="#requests" data-page="requests" class="service-only" hidden>Service tickets</a>
      <p class="menu-group admin-only">Manage</p>
      <a href="#edit" data-page="edit" class="admin-only">Edit trucks</a>
      <a href="#new" data-page="new" class="admin-only">Add a truck</a>
      <a href="#users" data-page="users" class="admin-only">Users</a>
      <p class="menu-group">Account</p>
      <a href="#account" data-page="account">My account</a>
      <button type="button" id="signout">Sign out</button>
    </nav>
    <a class="logo" id="logo" href="#trucks" aria-label="Farber Fleet – all trucks" title="All trucks"></a>
    <div class="top-right">
      <span class="who" id="who"></span>
      <select id="view-as" class="pill-btn" aria-label="View the site as" hidden>
        <option value="">View as: Admin</option>
        <option value="sales">View as: Sales</option>
        <option value="service">View as: Service</option>
        <option value="engineering">View as: Engineering</option>
      </select>
      <button type="button" class="pill-btn" id="theme-btn" aria-expanded="false" aria-controls="themes">Theme: <span id="theme-name">Auto</span> ▾</button>
      <div class="themes" id="themes" hidden>
        <div class="theme-grid">
          <button type="button" class="theme-opt" data-theme="auto" aria-pressed="true"><span class="prev prev-auto"></span>Auto (match device)</button>
        </div>
        <p class="menu-group">Day</p>
        <div class="theme-grid">
          <button type="button" class="theme-opt" data-theme="clinic" aria-pressed="false"><span class="prev" style="--p-bg:#f4f7f9;--p-panel:#ffffff;--p-fg:#14212b;--p-a:#1f6fb2;--p-b:#d0573a"></span>Clinic</button>
          <button type="button" class="theme-opt" data-theme="fog" aria-pressed="false"><span class="prev" style="--p-bg:#eceff3;--p-panel:#fbfcfd;--p-fg:#1d2733;--p-a:#4a6fa5;--p-b:#b85c78"></span>Morning Fog</button>
          <button type="button" class="theme-opt" data-theme="sandstone" aria-pressed="false"><span class="prev" style="--p-bg:#f2ece3;--p-panel:#fffdf9;--p-fg:#2b241c;--p-a:#8a5a2b;--p-b:#2f6f8f"></span>Sandstone</button>
          <button type="button" class="theme-opt" data-theme="sky" aria-pressed="false"><span class="prev" style="--p-bg:#e8f2fb;--p-panel:#ffffff;--p-fg:#0f2238;--p-a:#0b6bcb;--p-b:#e07b00"></span>Clear Sky</button>
          <button type="button" class="theme-opt" data-theme="sage" aria-pressed="false"><span class="prev" style="--p-bg:#edf2ed;--p-panel:#fbfdfb;--p-fg:#1b2a1f;--p-a:#3a7d44;--p-b:#b5651d"></span>Sage</button>
          <button type="button" class="theme-opt" data-theme="harbor" aria-pressed="false"><span class="prev" style="--p-bg:#ebf0f6;--p-panel:#ffffff;--p-fg:#102a43;--p-a:#1d4e89;--p-b:#e4572e"></span>Harbor</button>
          <button type="button" class="theme-opt" data-theme="citrus" aria-pressed="false"><span class="prev" style="--p-bg:#faf8ea;--p-panel:#ffffff;--p-fg:#26261a;--p-a:#c46a00;--p-b:#0e7c86"></span>Citrus</button>
          <button type="button" class="theme-opt" data-theme="blush" aria-pressed="false"><span class="prev" style="--p-bg:#f9eef1;--p-panel:#fffafb;--p-fg:#2e1a20;--p-a:#c2185b;--p-b:#3f51b5"></span>Blush</button>
          <button type="button" class="theme-opt" data-theme="glacier" aria-pressed="false"><span class="prev" style="--p-bg:#e9f6f7;--p-panel:#ffffff;--p-fg:#0e2a30;--p-a:#00838f;--p-b:#e0670b"></span>Glacier</button>
          <button type="button" class="theme-opt" data-theme="highway" aria-pressed="false"><span class="prev" style="--p-bg:#f4f4f0;--p-panel:#ffffff;--p-fg:#111111;--p-a:#d19a00;--p-b:#1a1a1a"></span>Highway</button>
        </div>
        <p class="menu-group">Night</p>
        <div class="theme-grid">
          <button type="button" class="theme-opt" data-theme="midnight" aria-pressed="false"><span class="prev" style="--p-bg:#0d1420;--p-panel:#151e2c;--p-fg:#e6edf5;--p-a:#5aa9e6;--p-b:#f4845f"></span>Midnight</button>
          <button type="button" class="theme-opt" data-theme="instrument" aria-pressed="false"><span class="prev" style="--p-bg:#120f0a;--p-panel:#1c1810;--p-fg:#f3e9d2;--p-a:#ffb000;--p-b:#4fc3f7"></span>Instrument</button>
          <button type="button" class="theme-opt" data-theme="nightshift" aria-pressed="false"><span class="prev" style="--p-bg:#121226;--p-panel:#1b1b36;--p-fg:#e8e6f7;--p-a:#8c7cf0;--p-b:#f78fb3"></span>Night Shift</button>
          <button type="button" class="theme-opt" data-theme="deepsea" aria-pressed="false"><span class="prev" style="--p-bg:#071a1f;--p-panel:#0e252b;--p-fg:#def3f2;--p-a:#2ec4b6;--p-b:#ff9f1c"></span>Deep Sea</button>
          <button type="button" class="theme-opt" data-theme="forest" aria-pressed="false"><span class="prev" style="--p-bg:#0e1a12;--p-panel:#15241a;--p-fg:#e3efe4;--p-a:#6fcf7f;--p-b:#e9c46a"></span>Forest Night</button>
          <button type="button" class="theme-opt" data-theme="plum" aria-pressed="false"><span class="prev" style="--p-bg:#1a1020;--p-panel:#24172c;--p-fg:#f1e6f5;--p-a:#d17be6;--p-b:#6fd3e0"></span>Plum</button>
          <button type="button" class="theme-opt" data-theme="ember" aria-pressed="false"><span class="prev" style="--p-bg:#1a0f0c;--p-panel:#251612;--p-fg:#f6e7e1;--p-a:#ff7a45;--p-b:#ffd166"></span>Ember</button>
          <button type="button" class="theme-opt" data-theme="graphite" aria-pressed="false"><span class="prev" style="--p-bg:#141517;--p-panel:#1d1f22;--p-fg:#ececec;--p-a:#9ab8ff;--p-b:#ffb86b"></span>Graphite</button>
          <button type="button" class="theme-opt" data-theme="aurora" aria-pressed="false"><span class="prev" style="--p-bg:#0b1418;--p-panel:#121f25;--p-fg:#e4f4f1;--p-a:#57e3b0;--p-b:#b388ff"></span>Aurora</button>
          <button type="button" class="theme-opt" data-theme="radar" aria-pressed="false"><span class="prev" style="--p-bg:#050d07;--p-panel:#0b170e;--p-fg:#d6f5dc;--p-a:#5cf08f;--p-b:#f5d547"></span>Radar</button>
        </div>
      </div>
    </div>
  </header>
  <div id="viewas-bar" class="viewas" hidden role="status">Viewing as <b id="viewas-name"></b>. Admin tools are hidden. <button type="button" id="viewas-exit" class="btn ghost small">Back to admin view</button></div>
  <div id="notice" class="notice bad" hidden role="alert"><strong id="notice-title"></strong><span id="notice-body"></span></div>
  <main id="app" aria-live="polite"><p class="loading">Loading…</p></main>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js?v=202611041346"></script>
<script src="app.js?v=202611041346"></script>
</body>
</html>
